<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Data Dispatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">PWA · refreshed every 6 hours</p>
        <h1>The Data Dispatch</h1>
        <p class="subtitle">Top data engineering and data leadership reads from the last 24 hours.</p>
      </div>
      <button id="refreshBtn">Check for New Now</button>
    </section>

    <section class="meta-card">
      <div>
        <span class="label">Status</span>
        <p id="status">Loading latest items...</p>
      </div>
      <div>
        <span class="label">Limit</span>
        <p>Top 25 deduped items</p>
      </div>
    </section>

    <section id="items" class="grid"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
